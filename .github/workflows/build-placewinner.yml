name: Build PlaceWinner Unity Ads APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK tidak ditemukan di runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan."
            find "$SDK" -maxdepth 4 -type f -name sdkmanager
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f \
            -iname '*UnityAds*Android*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP Unity Ads Android tidak ditemukan di root."
            ls -la
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f \
            -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan dalam ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $(dirname "$SETTINGS")"

      - name: Fix Java escaping
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.rglob("MainActivity.java"))
          if not files:
              raise SystemExit("MainActivity.java tidak ditemukan")

          p = files[0]
          lines = p.read_text(encoding="utf-8").splitlines()
          matches = [
              i for i, line in enumerate(lines)
              if "String safe = message.replace(" in line
          ]
          if len(matches) != 1:
              raise SystemExit(
                  "Baris String safe tidak ditemukan tepat satu kali; "
                  "periksa MainActivity.java."
              )

          lines[matches[0]] = r'''        String safe = message.replace("\\", "\\\\").replace("'", "\\'");'''
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Baris escaping Java diperbaiki.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "Build selesai tetapi APK tidak ditemukan."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaceWinner-UnityAds-APK
          path: ${{ steps.verify.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          
