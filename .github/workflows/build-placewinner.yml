
name: Build PlaceWinner Unity Ads APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f \
            -iname '*UnityAds*Android*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP proyek Unity Ads tidak ditemukan."
            ls -la
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f \
            -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Fix Java escaping error
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.rglob("MainActivity.java"))
          if not files:
              raise SystemExit("MainActivity.java tidak ditemukan")

          p = files[0]
          lines = p.read_text(encoding="utf-8").splitlines()
          fixed = False

          for i, line in enumerate(lines):
              if "String safe = message.replace(" in line:
                  lines[i] = r'''        String safe = message.replace("\\", "\\\\").replace("'", "\\'");'''
                  fixed = True
                  break

          if not fixed:
              raise SystemExit("Baris notifyAdError tidak ditemukan; periksa kode Java.")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Memperbaiki:", p)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaceWinner-UnityAds-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          
