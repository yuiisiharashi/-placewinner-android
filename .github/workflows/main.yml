
name: Build PlaceWinner APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Find and extract starter ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f \
            -iname '*UnityAds*STARTER*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Starter ZIP tidak ditemukan."
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          if [ ! -f extracted/pwandroid/build.gradle ] ||
             [ ! -f extracted/pwandroid/settings.gradle ] ||
             [ ! -f extracted/pwandroid/app/build.gradle ]; then
            echo "ERROR: Struktur proyek Android tidak lengkap."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_HOME" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK tidak tersedia di runner."
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd extracted/pwandroid
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlaceWinner-debug-apk
          path: extracted/pwandroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
