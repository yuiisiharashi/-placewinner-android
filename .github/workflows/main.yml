
name: Build PlaceWinner APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Find and extract starter ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*UnityAds*STARTER*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Starter ZIP tidak ditemukan."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          if [ ! -f extracted/pwandroid/gradlew ]; then
            echo "File gradlew tidak ditemukan di extracted/pwandroid."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd extracted/pwandroid
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlaceWinner-debug-apk
          path: extracted/pwandroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
