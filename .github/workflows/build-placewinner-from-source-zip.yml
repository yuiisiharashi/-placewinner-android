name: Build PlaceWinner from fixed source ZIP
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (find uploaded source ZIP)
        uses: actions/checkout@v4
      - name: Locate and extract fixed source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="PlaceWinner-Firebase-Login-FIX.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root. Upload the fixed source ZIP to the root of the repository first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/placewinner-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/placewinner-source"
          test -f "$RUNNER_TEMP/placewinner-source/settings.gradle"
          test -f "$RUNNER_TEMP/placewinner-source/app/build.gradle"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK from fixed source
        working-directory: ${{ runner.temp }}/placewinner-source
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaceWinner-Firebase-Login-FIX-APK
          path: ${{ runner.temp }}/placewinner-source/app/build/outputs/apk/debug/app-debug.apk
