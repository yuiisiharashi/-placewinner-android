name: Build PlaceWinner from fixed source ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract fixed source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="PlaceWinner-Firebase-Login-FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP source tidak ditemukan di folder utama repo."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/placewinner-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/placewinner-source"

          SRC="$RUNNER_TEMP/placewinner-source"

          if [ ! -f "$SRC/settings.gradle" ] && [ ! -f "$SRC/settings.gradle.kts" ]; then
            echo "::error::settings.gradle tidak ditemukan di root ZIP."
            find "$SRC" -maxdepth 3 -type f | head -80
            exit 1
          fi

          if [ ! -f "$SRC/app/build.gradle" ] && [ ! -f "$SRC/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle tidak ditemukan di root ZIP."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ runner.temp }}/placewinner-source
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaceWinner-Firebase-Login-FIX-APK
          path: ${{ runner.temp }}/placewinner-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
